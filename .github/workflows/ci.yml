name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run application tests
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: fake://
        run: >-
          python -m pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t day12-agent:ci .

  deploy:
    name: Deploy and smoke test
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Trigger Railway deployment when token is configured
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            npm install --global @railway/cli
            railway up --service day12-agent --detach
          else
            echo "Railway GitHub Auto Deploy handles this push."
          fi

      - name: Smoke test Railway deployment
        env:
          PUBLIC_URL: https://day12-agent-production-f0e8.up.railway.app
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS "$PUBLIC_URL/health"; then
              exit 0
            fi
            echo "Waiting for Railway deployment ($attempt/12)..."
            sleep 10
          done
          exit 1
